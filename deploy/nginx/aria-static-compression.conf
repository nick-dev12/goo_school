# Fragment Nginx — à inclure dans le server {} de aria-edu.com (ou dans http {}).
# Sans lui, les CSS et JavaScript partent non compressés : 5 à 8 fois plus lourds sur une connexion 3G.
#
# 1) Compression à la volée de tout ce qui est du texte (Nginx ne compresse que le HTML par défaut).
gzip on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_vary on;
gzip_proxied any;
gzip_types text/css application/javascript text/javascript application/json application/manifest+json
           image/svg+xml text/plain application/xml;

# 2) Dans le bloc « location /static/ » existant, ajouter la ligne suivante : Nginx sert alors directement
#    les copies .gz produites par « python manage.py collectstatic » (aucun calcul à chaque requête).
#        gzip_static on;
#
# 3) Recommandé : HTTP/2 sur le port 443 (« listen 443 ssl http2; » ou « http2 on; » selon la version de
#    Nginx). Toutes les ressources d'une page passent alors par une seule connexion, ce qui évite les
#    ouvertures de connexion répétées, très coûteuses quand la latence est élevée.
