{% load static %}
<link
  rel="stylesheet"
  href="{% static 'school_admin/css/enseignant/bottom_nav.css' %}?v=1.0.2"
/>
<nav
  class="enseignant-bottom-nav bottom-nav-commercial"
  aria-label="Navigation principale de l'espace commercial"
>
  <ul class="bottom-nav-list">
    <li
      class="bottom-nav-item nav-item-primary nav-item-main-7 {% if request.resolver_match.url_name == 'dashboard_commercial' %}active{% endif %}"
    >
      <a href="{% url 'school_admin:dashboard_commercial' %}">
        <span class="icon-wrapper icon-home"><i class="fas fa-home"></i></span>
        <span class="label">Accueil</span>
      </a>
    </li>
    <li class="bottom-nav-item nav-item-primary nav-item-main-7 {% if request.resolver_match.url_name == 'commercial_liste_etablissements' or request.resolver_match.url_name == 'commercial_detail_etablissement' %}active{% endif %}">
      <a href="{% url 'school_admin:commercial_liste_etablissements' %}">
        <span class="icon-wrapper icon-prospects"
          ><i class="fas fa-building"></i
        ></span>
        <span class="label">Prospects</span>
      </a>
    </li>
    <li class="bottom-nav-item nav-item-primary nav-item-main-7 {% if request.resolver_match.url_name == 'commercial_ajouter_etablissement' %}active{% endif %}">
      <a href="{% url 'school_admin:commercial_ajouter_etablissement' %}">
        <span class="icon-wrapper icon-ajouter"
          ><i class="fas fa-plus-circle"></i
        ></span>
        <span class="label">Nouveau</span>
      </a>
    </li>
    <li class="bottom-nav-item nav-item-primary nav-item-main-7 {% if request.resolver_match.url_name == 'commercial_rendez_vous' %}active{% endif %}">
      <a href="{% url 'school_admin:commercial_rendez_vous' %}">
        <span class="icon-wrapper icon-calendar"
          ><i class="fas fa-calendar-alt"></i
        ></span>
        <span class="label">Rendez-vous</span>
      </a>
    </li>
    <li class="bottom-nav-item nav-item-primary nav-item-main-7 {% if request.resolver_match.url_name == 'commercial_comptes_rendus' or request.resolver_match.url_name == 'commercial_creer_rapport' %}active{% endif %}">
      <a href="{% url 'school_admin:commercial_comptes_rendus' %}">
        <span class="icon-wrapper icon-rapports"
          ><i class="fas fa-clipboard-list"></i
        ></span>
        <span class="label">Rapports</span>
      </a>
    </li>
    <li
      class="bottom-nav-item nav-item-extra nav-item-main-7 nav-item-complementary {% if request.resolver_match.url_name == 'commercial_messages' or request.resolver_match.url_name == 'commercial_conversation_etablissement' %}active{% endif %}"
    >
      <a href="{% url 'school_admin:commercial_messages' %}">
        <span class="icon-wrapper icon-messages"
          ><i class="fas fa-envelope"></i
        ></span>
        <span class="label">Messages</span>
      </a>
    </li>
    <li
      class="bottom-nav-item nav-item-extra nav-item-main-7 nav-item-complementary {% if request.resolver_match.url_name == 'commercial_profil' %}active{% endif %}"
    >
      <a href="{% url 'school_admin:commercial_profil' %}">
        <span class="icon-wrapper icon-profil"
          ><i class="fas fa-user-circle"></i
        ></span>
        <span class="label">Profil</span>
      </a>
    </li>
    <li class="bottom-nav-item menu-toggle-item">
      <button
        type="button"
        class="menu-toggle-button"
        id="commercialNavToggle"
        aria-haspopup="true"
        aria-expanded="false"
        aria-controls="navigationSection"
      >
        <span class="icon-wrapper icon-menu"
          ><i class="fas fa-ellipsis-h"></i
        ></span>
        <span class="label">Menu</span>
      </button>
    </li>
  </ul>
</nav>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const toggleButton = document.getElementById('commercialNavToggle');
    const navSection = document.getElementById('navigationSection');
    const navOverlay = document.getElementById('navOverlay');
    const closeBtn = document.getElementById('closeNavMenu');

    if (!toggleButton || !navSection || !navOverlay || !closeBtn) {
      return;
    }

    const ensureController = () => {
      if (window.commercialNavMenu) {
        return window.commercialNavMenu;
      }

      const openFallback = () => {
        navOverlay.classList.add('active');
        navSection.classList.add('active');
        document.body.style.overflow = 'hidden';
        document.dispatchEvent(new CustomEvent('commercialNavOpen'));
      };

      const closeFallback = () => {
        navSection.classList.remove('active');
        navOverlay.classList.remove('active');
        document.body.style.overflow = '';
        document.dispatchEvent(new CustomEvent('commercialNavClose'));
      };

      closeBtn.addEventListener('click', closeFallback);
      navOverlay.addEventListener('click', (event) => {
        if (event.target === navOverlay) {
          closeFallback();
        }
      });

      window.commercialNavMenu = {
        open: openFallback,
        close: closeFallback,
      };

      return window.commercialNavMenu;
    };

    toggleButton.addEventListener('click', () => {
      const controller = ensureController();
      if (!controller) {
        return;
      }
      const isOpen = navSection.classList.contains('active');
      if (isOpen) {
        controller.close();
      } else {
        controller.open();
      }
    });

    const setExpanded = (value) => {
      toggleButton.setAttribute('aria-expanded', value ? 'true' : 'false');
      toggleButton.classList.toggle('menu-open', value);
    };

    ensureController();
    document.addEventListener('commercialNavOpen', () => setExpanded(true));
    document.addEventListener('commercialNavClose', () => setExpanded(false));
  });
</script>
