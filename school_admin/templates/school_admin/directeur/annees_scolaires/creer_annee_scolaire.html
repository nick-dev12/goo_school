<!DOCTYPE html>
{% load static %}
{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Créer une Année Scolaire - {{ etablissement.nom }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'school_admin/css/directeur/header_directeur.css' %}" />
    {% trans "<style>
        body { font-family: 'Poppins', sans-serif; background: var(--gray-50, #f9fafb); margin: 0; padding: 0; }
        .main-content { max-width: 800px; margin: 0 auto; padding: 2rem; }
        .form-container { background: white; border-radius: 0.5rem; box-shadow: var(--shadow, 0 4px 6px -1px rgba(0, 0, 0, 0.1)); padding: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--gray-700, #374151); }
        input, select { width: 100%; padding: 0.75rem; border: 1px solid var(--gray-300, #d1d5db); border-radius: 0.5rem; font-size: 1rem; }
        .btn-primary { background: var(--primary, #3b82f6); color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 0.5rem; cursor: pointer; }
        .btn-secondary { background: var(--gray-500, #6b7280); color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 0.5rem; text-decoration: none; display: inline-block; }
        .form-actions { display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem; }
        .checkbox-group { display: flex; align-items: center; gap: 0.5rem; }
    </style>" %}
</head>
<body>
    {% include 'school_admin/directeur/partials/header_directeur.html' %}
    
    <div class="main-content">
        <h1><i class="fas fa-calendar-plus"></i> {% trans "Créer une Année Scolaire" %}</h1>
        
        <div class="form-container">
            <form method="post">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="libelle">{% trans "Libellé (ex: 2025-2026) *" %}</label>
                    <input type="text" id="libelle" name="libelle" value="{{ suggestions.libelle }}" required />
                </div>
                
                <div class="form-group">
                    <label for="annee_debut">{% trans "Année de début *" %}</label>
                    <input type="number" id="annee_debut" name="annee_debut" value="{{ suggestions.annee_debut }}" required />
                </div>
                
                <div class="form-group">
                    <label for="annee_fin">{% trans "Année de fin *" %}</label>
                    <input type="number" id="annee_fin" name="annee_fin" value="{{ suggestions.annee_fin }}" required />
                </div>
                
                <div class="form-group">
                    <label for="date_debut">{% trans "Date de début *" %}</label>
                    <input type="date" id="date_debut" name="date_debut" value="{{ suggestions.date_debut|date:'Y-m-d' }}" required />
                </div>
                
                <div class="form-group">
                    <label for="date_fin">{% trans "Date de fin *" %}</label>
                    <input type="date" id="date_fin" name="date_fin" value="{{ suggestions.date_fin|date:'Y-m-d' }}" required />
                </div>
                
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="est_ouverte" name="est_ouverte" />
                        <label for="est_ouverte" style="margin: 0;">{% trans "Ouvrir la session (permettre l'accès avant la date de début)" %}</label>
                    </div>
                </div>
                
                <div class="form-actions">
                    <a href="{% url 'directeur:liste_annees_scolaires' %}" class="btn-secondary">{% trans "Annuler" %}</a>
                    <button type="submit" class="btn-primary">{% trans "Créer l'année scolaire" %}</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
