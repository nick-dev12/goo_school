{% load i18n %}
<td class="scd-recus-cell">
    {% if paiements_ligne %}
        <div class="scd-recus-list">
            {% for p in paiements_ligne %}
                <a
                    href="{% url 'directeur:recu_paiement_directeur' p.id %}"
                    class="scd-btn-recu"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="{% trans 'Voir / imprimer le reçu' %}"
                >
                    <i class="fas fa-receipt" aria-hidden="true"></i>
                    <span class="scd-btn-recu__label">
                        {% if p.numero_recu %}{{ p.numero_recu }}{% else %}{{ p.date_paiement|date:"d/m/Y" }}{% endif %}
                    </span>
                </a>
            {% endfor %}
        </div>
    {% else %}
        <span class="scd-recus-empty">—</span>
    {% endif %}
</td>
