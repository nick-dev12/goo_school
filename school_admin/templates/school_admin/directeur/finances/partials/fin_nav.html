{% load i18n %}
<nav class="cg-nav cg-nav-shell" aria-label="{% trans 'Finances' %}">
    <div class="matiere-tabs-bar cg-pages-tabs" data-overflow-item-label="{% trans 'onglet' %}" data-overflow-items-label="{% trans 'onglets' %}">
        <div class="matiere-tabs-track" role="tablist" aria-label="{% trans 'Onglets Finances' %}">
            <a class="matiere-tab-btn {% if fin_nav == 'situation' %}active{% endif %}" href="{% url 'directeur:finances_situation' %}?{{ filtre_nav }}"><i class="fas fa-chart-line" aria-hidden="true"></i><span>{% trans "Situation" %}</span></a>
            <a class="matiere-tab-btn {% if fin_nav == 'entrees' %}active{% endif %}" href="{% url 'directeur:finances_entrees' %}?{{ filtre_nav }}"><i class="fas fa-arrow-down" aria-hidden="true"></i><span>{% trans "Entrées" %}</span></a>
            <a class="matiere-tab-btn {% if fin_nav == 'sorties' %}active{% endif %}" href="{% url 'directeur:finances_sorties' %}?{{ filtre_nav }}"><i class="fas fa-arrow-up" aria-hidden="true"></i><span>{% trans "Sorties" %}</span></a>
            <a class="matiere-tab-btn {% if fin_nav == 'tresorerie' %}active{% endif %}" href="{% url 'directeur:finances_tresorerie' %}?{{ filtre_nav }}"><i class="fas fa-building-columns" aria-hidden="true"></i><span>{% trans "Trésorerie" %}</span></a>
            <a class="matiere-tab-btn {% if fin_nav == 'financements' %}active{% endif %}" href="{% url 'directeur:finances_financements' %}?{{ filtre_nav }}"><i class="fas fa-landmark" aria-hidden="true"></i><span>{% trans "Financements" %}</span></a>
        </div>
        <div class="matiere-tabs-more-wrap" hidden>
            <button type="button" class="matiere-tabs-more-btn" aria-expanded="false" aria-haspopup="true" aria-label="{% trans 'Autres onglets' %}">
                <i class="fas fa-chevron-down" aria-hidden="true"></i>
                <span class="matiere-tabs-more-label">{% trans "Autres onglets" %}</span>
            </button>
            <div class="matiere-tabs-overflow-menu" role="menu" hidden></div>
        </div>
    </div>
</nav>
