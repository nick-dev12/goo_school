<!DOCTYPE html>
{% load static %}
{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% trans "Impression" %} — {% trans "Bulletin" %} — {{ eleve.nom_complet }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'school_admin/css/directeur/bulletin_eleve_superieur.css' %}?v=1.5.2" />
  </head>
  <body class="print-bulletin-superieur-body">
    <nav class="no-print bsup-print-toolbar" aria-label="{% trans 'Actions bulletin' %}">
      <a href="{{ retour_url }}" class="bsup-print-btn bsup-print-btn--back">
        <i class="fas fa-arrow-left" aria-hidden="true"></i>
        <span>{% trans "Retour aux bulletins" %}</span>
      </a>
      <button type="button" class="bsup-print-btn bsup-print-btn--print" onclick="window.print();">
        <i class="fas fa-print" aria-hidden="true"></i>
        <span>{% trans "Imprimer le bulletin" %}</span>
      </button>
    </nav>
    <div class="print-container">
      {% include 'school_admin/directeur/partials/bulletin_superieur_corps.html' %}
    </div>
  </body>
</html>
