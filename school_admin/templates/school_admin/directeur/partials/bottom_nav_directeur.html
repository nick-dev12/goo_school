<link
  rel="stylesheet"
  href="{% static 'school_admin/css/enseignant/bottom_nav.css' %}?v=1.0.3"
/>
<nav
  class="enseignant-bottom-nav bottom-nav-directeur"
  aria-label="Navigation principale de l’espace directeur"
>
  <ul class="bottom-nav-list">
    <li
      class="bottom-nav-item nav-item-primary nav-item-main-7 {% if request.resolver_match.url_name == 'dashboard_directeur' %}active{% endif %}"
    >

        <span class="icon-wrapper icon-home"><i class="fas fa-home"></i></span>
        <span class="label">Accueil</span>
      </a>
    </li>
    <li class="bottom-nav-item nav-item-primary nav-item-main-7 {% if request.resolver_match.url_name == 'gestion_etablissement' or request.resolver_match.url_name == 'liste_salles' or request.resolver_match.url_name == 'liste_affectations' or request.resolver_match.url_name == 'liste_classes' or request.resolver_match.url_name == 'configuration_horaires' or request.resolver_match.url_name == 'liste_professeurs' or request.resolver_match.url_name == 'liste_personnel' %}active{% endif %}">
      <a href="{% url 'directeur:gestion_etablissement' %}">
        <span class="icon-wrapper icon-etablissement"
          ><i class="fas fa-school"></i
        ></span>
        <span class="label">Établissement</span>
      </a>
    </li>
    <li class="bottom-nav-item nav-item-primary nav-item-main-7 {% if request.resolver_match.url_name == 'gestion_pedagogique' or request.resolver_match.url_name == 'gestion_periodes_scolaires' or request.resolver_match.url_name == 'configuration_moyennes_generales' or request.resolver_match.url_name == 'configuration_standards_reussite' %}active{% endif %}">
      <a href="{% url 'directeur:gestion_pedagogique' %}">
        <span class="icon-wrapper icon-pedagogie"
          ><i class="fas fa-graduation-cap"></i
        ></span>
        <span class="label">Pédagogie</span>
      </a>
    </li>
    <li class="bottom-nav-item nav-item-primary nav-item-main-7 {% if request.resolver_match.url_name == 'gestion_eleves' or request.resolver_match.url_name == 'demandes_liaison_liste' or request.resolver_match.url_name == 'bulletins_notes' or request.resolver_match.url_name == 'voir_bulletin_eleve' or request.resolver_match.url_name == 'attestation_reussite_liste' or request.resolver_match.url_name == 'attestation_conduite_liste' or request.resolver_match.url_name == 'certificat_scolarite_liste' or request.resolver_match.url_name == 'certificat_radiation_liste' %}active{% endif %}">
      <a href="{% url 'directeur:gestion_eleves' %}">
        <span class="icon-wrapper icon-eleves"
          ><i class="fas fa-user-graduate"></i
        ></span>
        <span class="label">Élèves</span>
      </a>
    </li>
    <li class="bottom-nav-item nav-item-primary nav-item-main-7 {% if request.resolver_match.url_name == 'gestion_administrative' or request.resolver_match.url_name == 'gestion_periodes_scolaires' or request.resolver_match.url_name == 'certificat_scolarite_liste' or request.resolver_match.url_name == 'certificat_radiation_liste' or request.resolver_match.url_name == 'attestation_reussite_liste' or request.resolver_match.url_name == 'attestation_conduite_liste' or request.resolver_match.url_name == 'fiche_inscription_liste' %}active{% endif %}">
      <a class="bouton-none" href="{% url 'directeur:gestion_administrative' %}">
        <span class="icon-wrapper icon-administration"
          ><i class="fas fa-file-alt"></i
        ></span>
        <span class="label">Administration</span>
      </a>
    </li>
    <li
      class="bottom-nav-item nav-item-extra nav-item-main-7 nav-item-complementary {% if request.resolver_match.url_name == 'annonces_directeur' %}active{% endif %}"
    >
      <a href="{% url 'directeur:annonces_directeur' %}">
        <span class="icon-wrapper icon-annonces"
          ><i class="fas fa-bullhorn"></i
        ></span>
        <span class="label">Annonces</span>
      </a>
    </li>
    <li
      class="bottom-nav-item nav-item-extra nav-item-complementary {% if request.resolver_match.url_name == 'gestion_examens' or request.resolver_match.url_name == 'emploi_du_temps_examens' or request.resolver_match.url_name == 'configurer_creneaux_examen' or request.resolver_match.url_name == 'modifier_session_examen' or request.resolver_match.url_name == 'supprimer_session_examen' %}active{% endif %}"
    >
      <a href="{% url 'directeur:gestion_examens' %}">
        <span class="icon-wrapper icon-examens"
          ><i class="fas fa-clipboard-list"></i
        ></span>
        <span class="label">Examens</span>
      </a>
    </li>
    <li
      class="bottom-nav-item nav-item-extra nav-item-complementary {% if request.resolver_match.url_name == 'facturation_directeur' %}active{% endif %}"
    >
      <a href="{% url 'directeur:facturation_directeur' %}">
        <span class="icon-wrapper icon-facturation"
          ><i class="fas fa-credit-card"></i
        ></span>
        <span class="label">Facturation</span>
      </a>
    </li>
    <li
    class="bottom-nav-item nav-item-extra nav-item-main-7 nav-item-complementary {% if request.resolver_match.url_name == 'profil_etablissement' %}active{% endif %}"
  >
    <a href="{% url 'directeur:profil_etablissement' %}">
      <span class="icon-wrapper icon-profil"
        ><i class="fas fa-user-cog"></i
      ></span>
      <span class="label">Profil</span>
    </a>
  </li>
    <li class="bottom-nav-item menu-toggle-item">
      <button
        type="button"
        class="menu-toggle-button"
        id="directeurNavToggle"
        aria-haspopup="true"
        aria-expanded="false"
        aria-controls="navigationSection"
      >
        <span class="icon-wrapper icon-menu"
          ><i class="fas fa-ellipsis-h"></i
        ></span>
        <span class="label">Menu</span>
      </button>
    </li>
  </ul>
</nav>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const toggleButton = document.getElementById('directeurNavToggle');
    const navSection = document.getElementById('navigationSection');
    const navOverlay = document.getElementById('navOverlay');
    const closeBtn = document.getElementById('closeNavMenu');

    if (!toggleButton || !navSection || !navOverlay || !closeBtn) {
      return;
    }

    const ensureController = () => {
      if (window.directeurNavMenu) {
        return window.directeurNavMenu;
      }

      const openFallback = () => {
        navOverlay.classList.add('active');
        navSection.classList.add('active');
        document.body.style.overflow = 'hidden';
        document.dispatchEvent(new CustomEvent('directeurNavOpen'));
      };

      const closeFallback = () => {
        navSection.classList.remove('active');
        navOverlay.classList.remove('active');
        document.body.style.overflow = '';
        document.dispatchEvent(new CustomEvent('directeurNavClose'));
      };

      closeBtn.addEventListener('click', closeFallback);
      navOverlay.addEventListener('click', (event) => {
        if (event.target === navOverlay) {
          closeFallback();
        }
      });

      window.directeurNavMenu = {
        open: openFallback,
        close: closeFallback,
      };

      return window.directeurNavMenu;
    };

    toggleButton.addEventListener('click', () => {
      const controller = ensureController();
      if (!controller) {
        return;
      }
      const isOpen = navSection.classList.contains('active');
      if (isOpen) {
        controller.close();
      } else {
        controller.open();
      }
    });

    const setExpanded = (value) => {
      toggleButton.setAttribute('aria-expanded', value ? 'true' : 'false');
      toggleButton.classList.toggle('menu-open', value);
    };

    ensureController();
    document.addEventListener('directeurNavOpen', () => setExpanded(true));
    document.addEventListener('directeurNavClose', () => setExpanded(false));
  });
</script>
