{% load i18n %}

<div class="form-row">
    <div class="form-group">
        <label class="form-label" for="{{ prefix }}sexe">
            <i class="fas fa-venus-mars"></i>
            {% trans "Sexe" %} <span class="required">*</span>
        </label>
        <select class="form-control form-input {% if field_errors.sexe %}is-invalid{% endif %}"
                id="{{ prefix }}sexe"
                name="sexe"
                required>
            <option value="">{% trans "Sélectionnez" %}</option>
            <option value="M" {% if form_data.sexe == 'M' %}selected{% endif %}>{% trans "Masculin" %}</option>
            <option value="F" {% if form_data.sexe == 'F' %}selected{% endif %}>{% trans "Féminin" %}</option>
        </select>
        {% if field_errors.sexe %}
            <div class="invalid-feedback">{{ field_errors.sexe }}</div>
        {% endif %}
    </div>

    <div class="form-group">
        <label class="form-label" for="{{ prefix }}date_embauche">
            <i class="fas fa-calendar-check"></i>
            {% trans "Date d'embauche" %}
            <span class="label-optional">{% trans "(Facultatif)" %}</span>
        </label>
        <input type="date"
               class="form-control form-input {% if field_errors.date_embauche %}is-invalid{% endif %}"
               id="{{ prefix }}date_embauche"
               name="date_embauche"
               value="{{ form_data.date_embauche|default:'' }}">
        {% if field_errors.date_embauche %}
            <div class="invalid-feedback">{{ field_errors.date_embauche }}</div>
        {% endif %}
    </div>
</div>
