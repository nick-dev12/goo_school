{% load i18n %}

<div class="form-section documents-section">
    <div class="section-header">
        <div class="section-icon">
            <i class="fas fa-file-alt"></i>
        </div>
        <div>
            <h3 class="section-title">{% trans "Documents" %}</h3>
            <p class="section-hint">{% trans "Facultatif — vous pouvez ajouter autant de documents que nécessaire." %}</p>
        </div>
    </div>

    <div class="documents-upload-list" id="{{ container_id|default:'documents-upload-list' }}">
        <div class="document-upload-row">
            <div class="form-group">
                <label class="form-label">{% trans "Libellé" %} <span class="label-optional">{% trans "(Facultatif)" %}</span></label>
                <input type="text"
                       class="form-control form-input"
                       name="documents_libelle"
                       placeholder="{% trans 'Ex: CNI, Diplôme, Contrat…' %}">
            </div>
            <div class="form-group">
                <label class="form-label">{% trans "Fichier" %} <span class="label-optional">{% trans "(Facultatif)" %}</span></label>
                <input type="file"
                       class="form-control form-input"
                       name="documents_fichier"
                       accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">
            </div>
        </div>
    </div>

    <button type="button" class="btn-add-document-row" onclick="ajouterLigneDocument('{{ container_id|default:'documents-upload-list' }}')">
        <i class="fas fa-plus"></i>
        {% trans "Ajouter un autre document" %}
    </button>
</div>
