<!DOCTYPE html>
{% load static %}
{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reçu d'Inscription - {{ eleve_info.nom_complet }}</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Arial:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="{% static 'school_admin/css/directeur/reçu_inscription_eleve.css' %}?v=1.0.2"
    />
    <!-- QR Code Library : script externe, ne pas envelopper dans trans (conflit de guillemets) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  </head>
  <body>
    <!-- Actions d'impression et navigation -->
    <div class="print-actions">
      <button class="btn-print" onclick="window.print()">{% trans "Imprimer" %}</button>
      <a href="{% url 'secretaire:liste_eleves' %}" class="btn-back">{% trans "Retour à la liste" %}</a>
    </div>

    <!-- Reçu Container -->
    <div class="receipt-page-wrapper">
      {% include 'school_admin/directeur/secretaire/partials/recu_inscription_eleve_inner.html' %}
    </div>

    <script>
      function initRecuQrCodes(root) {
        root = root || document;
        if (typeof QRCode === 'undefined') {
          return;
        }
        var qrEleve = root.querySelector('#qrCodeEleve');
        if (qrEleve && qrEleve.dataset.qrUrl && !qrEleve.querySelector('canvas')) {
          new QRCode(qrEleve, {
            text: qrEleve.dataset.qrUrl,
            width: 120,
            height: 120,
            colorDark: '#000000',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.M
          });
        }
        var qrParent = root.querySelector('#qrCodeParent');
        if (qrParent && qrParent.dataset.qrUrl && !qrParent.querySelector('canvas')) {
          new QRCode(qrParent, {
            text: qrParent.dataset.qrUrl,
            width: 120,
            height: 120,
            colorDark: '#000000',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.M
          });
        }
      }
      document.addEventListener('DOMContentLoaded', function() {
        initRecuQrCodes(document);
      });
    </script>

  </body>
</html>
