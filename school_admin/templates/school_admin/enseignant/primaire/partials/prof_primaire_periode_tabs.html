{% if periodes or periodes_scolaires %}
{% with periodes_list=periodes|default:periodes_scolaires sel_periode=periode_selectionnee|default:periode_active %}
<nav class="prof-primaire-hub-nav" aria-label="Périodes scolaires">
    <div class="matiere-tabs-bar prof-primaire-periodes-bar" data-overflow-item-label="Période" data-overflow-items-label="périodes">
        <div class="matiere-tabs-track" role="tablist">
            {% for periode in periodes_list %}
                <a role="tab"
                   class="matiere-tab-btn prof-primaire-tab-link {% if sel_periode and sel_periode.id == periode.id %}active{% endif %}"
                   aria-selected="{% if sel_periode and sel_periode.id == periode.id %}true{% else %}false{% endif %}"
                   href="?periode={{ periode.id }}{% if initial_classe_id %}&classe={{ initial_classe_id }}{% endif %}{% if initial_matiere_id %}&matiere={{ initial_matiere_id }}{% endif %}">
                    <i class="fas fa-calendar-alt" aria-hidden="true"></i>
                    <span>{{ periode.nom_periode }}</span>
                </a>
            {% endfor %}
        </div>
        <div class="matiere-tabs-more-wrap" hidden>
            <button type="button" class="matiere-tabs-more-btn" aria-expanded="false" aria-haspopup="true" aria-label="Autres périodes">
                <i class="fas fa-chevron-down" aria-hidden="true"></i>
                <span class="matiere-tabs-more-label">Autres périodes</span>
            </button>
            <div class="matiere-tabs-overflow-menu" role="menu" hidden></div>
        </div>
    </div>
</nav>
{% endwith %}
{% endif %}
