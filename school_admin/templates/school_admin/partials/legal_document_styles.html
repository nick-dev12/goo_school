<style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #1d4ed8;
            --secondary: #7c3aed;
            --accent: #ef4444;
            --success: #10b981;
            --white: #ffffff;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --text-primary: var(--gray-800);
            --text-secondary: var(--gray-600);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 20px 40px -12px rgba(15, 23, 42, 0.15);
            --radius: 12px;
            --radius-sm: 8px;
            --max-read: 52rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 100%;
        }

        @media (max-width: 1024px) {
            html { font-size: 94%; }
        }

        @media (max-width: 640px) {
            html { font-size: 88%; }
        }

        @media (max-width: 400px) {
            html { font-size: 85%; }
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(180deg, var(--gray-50) 0%, var(--gray-100) 35%, var(--gray-50) 100%);
            color: var(--text-primary);
            line-height: 1.65;
            min-height: 100vh;
            min-height: 100dvh;
            padding-inline: env(safe-area-inset-left, 0);
            padding-right: env(safe-area-inset-right, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
        }

        .legal-topbar {
            background: var(--white);
            border-bottom: 1px solid var(--gray-200);
            padding: 0.65rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: var(--shadow-sm);
        }

        .legal-brand {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--gray-900);
            text-decoration: none;
        }

        .legal-brand img {
            height: clamp(28px, 6vw, 36px);
            width: auto;
            border-radius: 6px;
        }

        .legal-topbar-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .legal-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.35rem 0.65rem;
            border-radius: 999px;
            background: var(--gray-100);
            color: var(--gray-700);
        }

        .legal-chip i { color: var(--primary); }

        .btn-legal-nav {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid var(--gray-200);
            background: var(--white);
            color: var(--gray-800);
            transition: border-color 0.2s, color 0.2s, box-shadow 0.2s;
        }

        .btn-legal-nav:hover {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .btn-legal-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white);
            border-color: transparent;
        }

        .btn-legal-primary:hover {
            color: var(--white);
            filter: brightness(1.05);
            box-shadow: var(--shadow);
        }

        .legal-hero {
            max-width: 1200px;
            margin: 0 auto;
            padding: clamp(1.25rem, 4vw, 2.5rem) clamp(0.75rem, 3vw, 1.25rem) clamp(1rem, 3vw, 2rem);
        }

        .legal-hero-inner {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 55%, #1e3a8a 100%);
            color: var(--white);
            border-radius: clamp(8px, 2vw, var(--radius));
            padding: clamp(1.25rem, 4vw, 2.25rem) clamp(1rem, 4vw, 2rem);
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .legal-hero-inner::after {
            content: '';
            position: absolute;
            inset: -40% 40% auto -20%;
            height: 120%;
            background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 65%);
            pointer-events: none;
        }

        .legal-hero-content {
            position: relative;
            z-index: 1;
            max-width: var(--max-read);
        }

        .legal-hero h1 {
            font-size: clamp(1.2rem, 4.5vw, 2.15rem);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 0.65rem;
            letter-spacing: -0.02em;
        }

        .legal-hero-lead {
            font-size: clamp(0.875rem, 2.4vw, 1.05rem);
            opacity: 0.95;
            max-width: 38rem;
            margin-bottom: 1rem;
            line-height: 1.55;
        }

        .legal-hero-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 0.75rem;
            align-items: center;
            font-size: clamp(0.7rem, 2vw, 0.8125rem);
            opacity: 0.9;
        }

        .legal-hero-meta span {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legal-layout {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 clamp(0.75rem, 3vw, 1.25rem) clamp(2rem, 5vw, 3.5rem);
            display: grid;
            grid-template-columns: minmax(0, 16.5rem) minmax(0, 1fr);
            gap: clamp(1rem, 3vw, 2rem);
            align-items: start;
        }

        .legal-toc-wrap {
            position: sticky;
            top: clamp(3.75rem, 12vw, 4.5rem);
        }

        .legal-toc {
            background: var(--white);
            border-radius: clamp(8px, 2vw, var(--radius));
            border: 1px solid var(--gray-200);
            padding: clamp(0.85rem, 2.5vw, 1.15rem) clamp(0.75rem, 2vw, 1rem);
            box-shadow: var(--shadow);
        }

        .legal-toc-title {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--gray-500);
            margin-bottom: 0.75rem;
        }

        .legal-toc ul {
            list-style: none;
        }

        .legal-toc li { margin-bottom: 0.35rem; }

        .legal-toc a {
            display: block;
            font-size: 0.8125rem;
            color: var(--gray-700);
            text-decoration: none;
            padding: 0.35rem 0.5rem;
            border-radius: 6px;
            line-height: 1.4;
            transition: background 0.15s, color 0.15s;
        }

        .legal-toc a:hover,
        .legal-toc a:focus-visible {
            background: rgba(59, 130, 246, 0.08);
            color: var(--primary-dark);
            outline: none;
        }

        .legal-main {
            min-width: 0;
        }

        .trust-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr));
            gap: clamp(0.65rem, 2vw, 1rem);
            margin-bottom: clamp(1.25rem, 4vw, 2.25rem);
        }

        .trust-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
            padding: clamp(0.75rem, 2.5vw, 1.1rem) clamp(0.85rem, 2.5vw, 1.15rem);
            box-shadow: var(--shadow-sm);
        }

        .trust-card i {
            font-size: clamp(1.1rem, 3vw, 1.35rem);
            color: var(--primary);
            margin-bottom: 0.4rem;
            display: block;
        }

        .trust-card h3 {
            font-size: clamp(0.875rem, 2.2vw, 0.95rem);
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 0.3rem;
        }

        .trust-card p {
            font-size: clamp(0.75rem, 2vw, 0.8125rem);
            color: var(--text-secondary);
            line-height: 1.45;
        }

        .legal-paper {
            background: var(--white);
            border-radius: clamp(8px, 2vw, var(--radius));
            border: 1px solid var(--gray-200);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .legal-section {
            padding: clamp(1.15rem, 3.5vw, 2rem) clamp(0.9rem, 3vw, 1.75rem);
            border-bottom: 1px solid var(--gray-100);
        }

        .legal-section h2 {
            font-size: clamp(1.05rem, 2.8vw, 1.25rem);
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            scroll-margin-top: clamp(4rem, 14vw, 5.5rem);
            flex-wrap: wrap;
        }

        .legal-section h2 i {
            color: var(--primary);
            font-size: clamp(0.95rem, 2.5vw, 1.1rem);
            opacity: 0.95;
            margin-top: 0.15em;
            flex-shrink: 0;
        }

        .legal-section h3 {
            font-size: clamp(0.95rem, 2.4vw, 1.05rem);
            font-weight: 600;
            color: var(--gray-800);
            margin: 1.1rem 0 0.5rem;
        }

        .legal-section p {
            font-size: clamp(0.8125rem, 2.1vw, 0.9375rem);
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            max-width: var(--max-read);
            line-height: 1.6;
        }

        .legal-section ul,
        .legal-section ol {
            margin: 0.45rem 0 0.75rem 1.1rem;
            max-width: var(--max-read);
            color: var(--text-secondary);
            font-size: clamp(0.8125rem, 2.1vw, 0.9375rem);
            line-height: 1.55;
            padding-inline-start: 0.15rem;
        }

        .legal-section li { margin-bottom: 0.4rem; }

        .legal-section:last-of-type {
            border-bottom: none;
        }

        .legal-section strong { color: var(--gray-800); }

        .legal-callout {
            border-radius: var(--radius-sm);
            padding: clamp(0.8rem, 2.5vw, 1rem) clamp(0.9rem, 2.5vw, 1.15rem);
            margin: clamp(0.85rem, 2.5vw, 1.15rem) 0;
            max-width: var(--max-read);
            font-size: clamp(0.78rem, 2.1vw, 0.9rem);
            line-height: 1.55;
        }

        .legal-callout--info {
            background: rgba(59, 130, 246, 0.08);
            border-left: 4px solid var(--primary);
            color: var(--gray-800);
        }

        .legal-callout--warn {
            background: rgba(251, 191, 36, 0.12);
            border-left: 4px solid #d97706;
            color: var(--gray-800);
        }

        .legal-callout--ok {
            background: rgba(16, 185, 129, 0.1);
            border-left: 4px solid var(--success);
            color: var(--gray-800);
        }

        .legal-table-wrap {
            overflow-x: auto;
            margin: clamp(0.65rem, 2vw, 1rem) 0;
            max-width: 100%;
            -webkit-overflow-scrolling: touch;
            border-radius: var(--radius-sm);
            border: 1px solid var(--gray-200);
        }

        .legal-table {
            width: 100%;
            border-collapse: collapse;
            font-size: clamp(0.7rem, 2vw, 0.8125rem);
            min-width: 320px;
        }

        .legal-table th,
        .legal-table td {
            border: 1px solid var(--gray-200);
            padding: clamp(0.45rem, 1.8vw, 0.65rem) clamp(0.5rem, 2vw, 0.75rem);
            text-align: left;
            vertical-align: top;
        }

        .legal-table th {
            background: var(--gray-50);
            font-weight: 600;
            color: var(--gray-800);
        }

        .legal-table td {
            color: var(--text-secondary);
        }

        .legal-footer-cta {
            max-width: 1200px;
            margin: 0 auto clamp(1.25rem, 4vw, 2rem);
            padding: 0 clamp(0.75rem, 3vw, 1.25rem);
        }

        .legal-footer-cta-inner {
            background: var(--gray-900);
            color: var(--white);
            border-radius: clamp(8px, 2vw, var(--radius));
            padding: clamp(1rem, 3vw, 1.5rem) clamp(1rem, 3vw, 1.75rem);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.85rem;
        }

        .legal-footer-cta-inner p {
            font-size: clamp(0.78rem, 2.1vw, 0.9rem);
            opacity: 0.92;
            max-width: 36rem;
            line-height: 1.5;
        }

        .legal-footer-cta-inner .btn-row {
            display: flex;
            gap: 0.65rem;
            flex-wrap: wrap;
        }

        .legal-inline-link {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px solid rgba(59, 130, 246, 0.35);
        }

        .legal-inline-link:hover {
            border-bottom-color: var(--primary);
        }

        .legal-small {
            font-size: clamp(0.72rem, 2vw, 0.8125rem);
            color: var(--gray-500);
            max-width: var(--max-read);
            line-height: 1.5;
            padding-inline: clamp(0.75rem, 3vw, 1.25rem);
        }

        .legal-page-footnote {
            font-size: clamp(0.68rem, 1.9vw, 0.78rem);
            color: var(--gray-500);
            text-align: center;
            line-height: 1.5;
            max-width: 40rem;
            margin: 0 auto;
            padding: 0 clamp(0.75rem, 3vw, 1.25rem) max(1.5rem, env(safe-area-inset-bottom, 0px));
        }

        /* Tablette : sommaire en grille compacte */
        @media (max-width: 1024px) {
            .legal-toc ul {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 0.2rem 0.5rem;
            }

            .legal-toc li {
                margin-bottom: 0;
            }

            .legal-toc a {
                font-size: 0.78rem;
                padding: 0.32rem 0.45rem;
            }

            .legal-toc-title {
                margin-bottom: 0.55rem;
            }
        }

        @media (max-width: 960px) {
            .legal-layout {
                grid-template-columns: 1fr;
            }

            .legal-toc-wrap {
                position: relative;
                top: auto;
            }

            .legal-toc {
                max-height: none;
            }

            .legal-toc ul {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            .legal-toc ul {
                grid-template-columns: 1fr;
            }

            .legal-toc a {
                font-size: 0.8rem;
                padding: 0.38rem 0.5rem;
            }

            .legal-topbar {
                flex-direction: column;
                align-items: stretch;
                padding-inline: max(0.65rem, env(safe-area-inset-left));
                padding-right: max(0.65rem, env(safe-area-inset-right));
            }

            .legal-topbar-actions {
                justify-content: stretch;
                flex-direction: column;
            }

            .btn-legal-nav {
                justify-content: center;
                width: 100%;
                min-width: 0;
                padding: 0.5rem 0.85rem;
            }

            .legal-chip {
                justify-content: center;
                width: 100%;
            }

            .legal-footer-cta-inner .btn-row {
                flex-direction: column;
                width: 100%;
            }

            .legal-footer-cta-inner .btn-row .btn-legal-nav {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .legal-brand {
                font-size: 0.95rem;
            }

            .legal-hero-meta span {
                width: 100%;
            }

            .trust-cards {
                grid-template-columns: 1fr;
            }
        }
    
        .legal-related-doc {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
            padding: clamp(0.85rem, 2.5vw, 1rem) clamp(0.9rem, 2.5vw, 1.15rem);
            margin-bottom: clamp(1rem, 3vw, 1.5rem);
            max-width: var(--max-read);
            font-size: clamp(0.8125rem, 2.1vw, 0.9rem);
            color: var(--text-secondary);
            line-height: 1.55;
        }
        .legal-related-doc strong { color: var(--gray-800); }
        .legal-section code {
            font-size: 0.85em;
            background: var(--gray-100);
            padding: 0.1em 0.35em;
            border-radius: 4px;
        }

    </style>
